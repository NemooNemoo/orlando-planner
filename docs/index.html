<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orlando Park Planner</title>
  <meta name="description" content="Planificateur Walt Disney World + Universal Orlando basé sur les temps d'attente réels.">
  <meta name="theme-color" content="#c8643b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="34" height="34">
      <div>
        <h1 data-i18n="app_title">Orlando Park Planner</h1>
        <p class="clock" id="clock"></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="pill ghost" id="btn-install" hidden data-i18n="install"></button>
      <button class="pill ghost" id="btn-notes">📥 <span class="hide-sm" data-i18n="notes_import">Importer mes notes</span></button>
      <button class="pill" id="btn-lang" aria-label="Language">EN</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="main" aria-live="polite">
    <div class="card center muted" data-i18n="loading">Chargement des données…</div>
  </main>

  <footer class="foot">
    <a href="https://queue-times.com" target="_blank" rel="noopener" class="powered" data-i18n="powered">Powered by Queue-Times.com</a>
    <p id="data-info" class="muted small"></p>
    <p class="muted small" data-i18n="legal"></p>
  </footer>

  <nav class="tabs" id="tabs">
    <button data-tab="setup"><span class="ico">⚙️</span><span data-i18n="tab_setup">Réglages</span></button>
    <button data-tab="calendar"><span class="ico">📅</span><span data-i18n="tab_calendar">Calendrier</span></button>
    <button data-tab="day"><span class="ico">🕘</span><span data-i18n="tab_day">Journée</span></button>
    <button data-tab="live"><span class="ico">📡</span><span data-i18n="tab_live">Direct</span></button>
  </nav>

  <dialog id="notes-dialog">
    <form method="dialog" class="dialog-body">
      <h2 data-i18n="notes_title"></h2>
      <p class="muted small" data-i18n="notes_help"></p>
      <label class="file-btn pill">
        <span data-i18n="notes_import"></span>
        <input type="file" class="csv-input" accept=".csv,text/csv" multiple hidden>
      </label>
      <div id="notes-status"></div>
      <h3 class="small muted" data-i18n="imports_title"></h3>
      <div id="imports-list" class="imports-list"></div>
      <div class="row gap">
        <button class="pill" value="close" data-i18n="close"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
