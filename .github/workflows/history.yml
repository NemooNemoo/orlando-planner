name: Historique queue-times

on:
  schedule:
    - cron: "20 */2 * * *"   # toutes les 2 h ; une fois l'historique complet, ne récupère que les nouveaux jours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecte par tranches de 20 min (enregistrée après chaque tranche)
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            python scripts/history.py --max-minutes 20
            code=$?
            git add data/history
            if ! git diff --cached --quiet; then
              git commit -q -m "history: tranche $i $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase && git push -q
            fi
            if [ $code -eq 10 ]; then echo "Historique à jour."; exit 0; fi
            if [ $code -ne 0 ]; then echo "Arrêt de sécurité (code $code)."; exit $code; fi
          done
