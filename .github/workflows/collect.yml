name: Collecte temps d'attente
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collecter les temps d'attente
        run: python scripts/collect.py
      - name: Horaires et spectacles
        # ThemeParks.wiki : ne doit jamais faire échouer la collecte
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/themeparks.py
      - name: Recalculer les statistiques (1x/jour)
        run: python scripts/stats.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Impossible d'enregistrer après 3 essais"
          exit 1
