name: Collecte temps d'attente

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les temps d'attente
        run: python scripts/collect.py

      - name: Recalculer les statistiques (1x/jour)
        run: python scripts/stats.py

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
